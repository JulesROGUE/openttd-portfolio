; Réglages d'OpenTTD pour le relevé de la carte (scripts/export-js.sh) : affichage, zoom,
; indicateurs de chargement... Le moteur JavaScript rejoue ce que le moteur natif dessine
; avec ces réglages (zoom_min / zoom_max sont repris dans web/ottd/main.js).
[misc]
language = english.lng
graphicsset = OpenGFX
display_opt = SHOW_TOWN_NAMES|FULL_ANIMATION|FULL_DETAIL

[gui]
autosave_interval = 0
autosave_on_exit = false
pause_on_newgame = false
scroll_mode = 3
scrollwheel_scrolling = 0
zoom_min = 1
zoom_max = 4
population_in_label = false
show_finances = false
measure_tooltip = false
auto_scrolling = 0
statusbar_pos = 1
smooth_scroll = true
fullscreen = false

[locale]
currency = EUR
units_velocity = metric
units_power = metric
units_weight = metric
units_volume = metric
units_force = si
units_height = metric

[news_display]
