; Réglages d'OpenTTD dans le navigateur (copiés dans le paquet de données, /openttd.cfg).
[misc]
language = english.lng
graphicsset = OpenGFX
musicset = OpenMSX
soundsset = NoSound
display_opt = SHOW_TOWN_NAMES|FULL_ANIMATION|FULL_DETAIL

[gui]
autosave_interval = 0
autosave_on_exit = false
pause_on_newgame = false
scroll_mode = 3
scrollwheel_scrolling = 0
zoom_min = 1
zoom_max = 4
population_in_label = false
show_finances = false
measure_tooltip = false
auto_scrolling = 0
statusbar_pos = 1
smooth_scroll = true
fullscreen = false

[music]
playing = true
playlist = 0
shuffle = true
music_vol = 100
effect_vol = 100

[locale]
currency = EUR
units_velocity = metric
units_power = metric
units_weight = metric
units_volume = metric
units_force = si
units_height = metric

[news_display]
