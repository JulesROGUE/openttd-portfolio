<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectsLand</title>
  <link rel="icon" href="data:,">
  <meta name="build" content="__BUILD__">
  <link rel="stylesheet" href="portfolio.css?v=__BUILD__">
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <!-- illustration du projet ouvert (images du portfolio, chargées à la demande) -->
  <div id="illus" hidden>
    <!-- barre de titre façon OpenTTD : case de fermeture à gauche, titre centré -->
    <div class="il-title"><button type="button" id="il-close" title="Close" aria-label="Close"></button><span id="il-title"></span></div>
    <div class="il-body">
      <img id="il-img" alt="">
      <div class="il-caption" id="il-caption"></div>
    </div>
    <div class="il-nav" id="il-nav"><button type="button" id="il-prev">&lt; Prev</button><span id="il-count"></span><button type="button" id="il-next">Next &gt;</button></div>
  </div>
  <!-- écran de chargement : fond noir, deux lignes en bas au centre (même gabarit que Cube 2) -->
  <div id="loading">
    <div class="ld-text"><div>Chargement..</div><div id="ld-step">Moteur du jeu 1/3</div></div>
  </div>
  <!-- moteur JavaScript (port d'OpenTTD 15.3, sans WebAssembly ni son) -->
  <script src="ottd/gfx.js?v=__BUILD__"></script>
  <script src="ottd/text.js?v=__BUILD__"></script>
  <script src="ottd/data.js?v=__BUILD__"></script>
  <script src="ottd/viewport.js?v=__BUILD__"></script>
  <script src="ottd/gui.js?v=__BUILD__"></script>
  <script src="ottd/main.js?v=__BUILD__"></script>
  <script src="portfolio.js?v=__BUILD__"></script>
</body>
</html>
