<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTTD Portfolio</title>
  <link rel="icon" href="data:,">
  <meta name="build" content="__BUILD__">
  <link rel="stylesheet" href="portfolio.css?v=__BUILD__">
</head>
<body>
  <canvas id="canvas" class="emscripten" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <!-- illustration du projet ouvert (images du portfolio, chargées à la demande) -->
  <div id="illus" hidden>
    <div class="il-title"><span id="il-title"></span><button type="button" id="il-close" title="Close">×</button></div>
    <img id="il-img" alt="">
    <div class="il-caption" id="il-caption"></div>
    <div class="il-nav" id="il-nav"><button type="button" id="il-prev">&lt; Prev</button><span id="il-count"></span><button type="button" id="il-next">Next &gt;</button></div>
  </div>
  <!-- écran de chargement : étape, barre de progression, Mo téléchargés / total -->
  <div id="loading">
    <div class="ld-box">
      <div class="ld-title">Chargement de la carte des projets</div>
      <div class="ld-step" id="ld-step">Étape 1/2 · Téléchargement du jeu</div>
      <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
      <div class="ld-detail" id="ld-detail">Connexion au serveur…</div>
      <div class="ld-status" id="status"></div>
    </div>
  </div>
  <script src="midisynth.js?v=__BUILD__"></script>
  <script src="portfolio.js?v=__BUILD__"></script>
  <script src="openttd-data.js?v=__BUILD__"></script>
  <script src="openttd.js?v=__BUILD__" async></script>
</body>
</html>
